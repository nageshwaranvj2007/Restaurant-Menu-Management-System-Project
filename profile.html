<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

.header{
    background:#fa0822;
    color:white;
    text-align:center;
    padding:25px;
    font-size:34px;
    font-weight:bold;
}

.container{
    width:80%;
    margin:50px auto;
    background:white;
    padding:45px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.profile-icon{
    width:140px;
    height:140px;
    margin:auto;
    background:#fa0822;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
}

h1{
    text-align:center;
    color:#fa0822;
    margin:25px 0 40px;
}

.profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.profile-box{
    background:#f9f9f9;
    padding:25px;
    border-left:6px solid #fa0822;
    border-radius:8px;
    min-height:120px;
}

.profile-box label{
    display:block;
    color:#666;
    font-size:20px;
    margin-bottom:12px;
}

.profile-box p{
    font-size:24px;
    font-weight:bold;
    color:#111;
    margin:0;
    word-break:break-word;
}

.profile-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:20px;
}

.edit-btn{
    text-align:center;
    margin-top:35px;
}

.edit-btn button{
    padding:13px 25px;
    border:none;
    border-radius:6px;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin:5px;
}

#editButton{
    background:#fa0822;
}

#saveButton{
    background:#198754;
}

#cancelButton{
    background:#555;
}

.back-btn{
    text-align:center;
    margin-top:30px;
}

.back-btn a{
    display:inline-block;
    text-decoration:none;
    background:#fa0822;
    color:white;
    padding:13px 28px;
    border-radius:6px;
    font-size:18px;
}

.footer{
    text-align:center;
    margin:30px;
    color:#666;
}

@media(max-width:700px){

    .container{
        width:95%;
        padding:25px;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="header">
🍽 Tamil Nadu Restaurant - My Profile
</div>


<div class="container">

    <div class="profile-icon">
        👤
    </div>

    <h1>My Profile</h1>


    <div class="profile-grid">

        <!-- FULL NAME -->

        <div class="profile-box">

            <label>Full Name</label>

            <p id="fullname">Loading...</p>

            <input
                type="text"
                id="fullnameInput"
                style="display:none;"
            >

        </div>


        <!-- USERNAME -->

        <div class="profile-box">

            <label>Username</label>

            <p id="username">Loading...</p>

            <input
                type="text"
                id="usernameInput"
                style="display:none;"
            >

        </div>

        <div class="profile-box">

    <label>Email</label>

    <p id="email">Loading...</p>

    <input
        type="email"
        id="emailInput"
        style="display:none;"
    >

</div>


<div class="profile-box">

    <label>Mobile Number</label>

    <p id="mobile">Loading...</p>

    <input
        type="tel"
        id="mobileInput"
        style="display:none;"
    >

</div>


        <!-- ROLE -->

        <div class="profile-box">

            <label>Account Type</label>

            <p id="role">Loading...</p>

        </div>


        <!-- CREATED DATE -->

        <div class="profile-box">

            <label>Member Since</label>

            <p id="created_at">Loading...</p>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="edit-btn">

        <button
            id="editButton"
            onclick="editProfile()">
            ✏️ Edit Profile
        </button>

        <button
            id="saveButton"
            onclick="saveProfile()"
            style="display:none;">
            💾 Save Changes
        </button>

        <button
            id="cancelButton"
            onclick="cancelEdit()"
            style="display:none;">
            ❌ Cancel
        </button>

    </div>


    <div class="back-btn">

        <a href="customer dashboard.html">
            ⬅ Back to Dashboard
        </a>

    </div>

</div>


<div class="footer">
© 2026 Restaurant Menu Management System | Customer Profile
</div>


<script>

/* =====================================
   LOAD LOGGED-IN USER
===================================== */

window.onload = function(){

    fetch("php/get_profile.php", {
        method: "GET",
        credentials: "include"
    })

    .then(function(response){

        return response.json();

    })

    .then(function(data){

        console.log("PROFILE DATA:", data);

        if(data.success){

            document.getElementById("fullname").innerText =
                data.fullname;

            document.getElementById("username").innerText =
                data.username;

                document.getElementById("email").innerText =
    data.email || "Not Available";

document.getElementById("mobile").innerText =
    data.mobile || "Not Available";

            document.getElementById("role").innerText =
                data.role;

            document.getElementById("created_at").innerText =
                data.created_at;

        }
        else{

            alert(data.message);

        }

    })

    .catch(function(error){

        console.log("ERROR:", error);

        alert("Unable to load profile.");

    });

};


/* =====================================
   EDIT PROFILE
===================================== */

function editProfile(){

    document.getElementById("fullnameInput").value =
        document.getElementById("fullname").innerText;

    document.getElementById("usernameInput").value =
        document.getElementById("username").innerText;


    document.getElementById("fullname").style.display =
        "none";

    document.getElementById("username").style.display =
        "none";


    document.getElementById("fullnameInput").style.display =
        "block";

    document.getElementById("usernameInput").style.display =
        "block";

        document.getElementById("emailInput").value =
    document.getElementById("email").innerText;

document.getElementById("mobileInput").value =
    document.getElementById("mobile").innerText;

document.getElementById("email").style.display = "none";
document.getElementById("mobile").style.display = "none";

document.getElementById("emailInput").style.display = "block";
document.getElementById("mobileInput").style.display = "block";


    document.getElementById("editButton").style.display =
        "none";

    document.getElementById("saveButton").style.display =
        "inline-block";

    document.getElementById("cancelButton").style.display =
        "inline-block";

}


/* =====================================
   CANCEL EDIT
===================================== */

function cancelEdit(){

    document.getElementById("fullname").style.display =
        "block";

    document.getElementById("username").style.display =
        "block";


    document.getElementById("fullnameInput").style.display =
        "none";

    document.getElementById("usernameInput").style.display =
        "none";


    document.getElementById("editButton").style.display =
        "inline-block";

    document.getElementById("saveButton").style.display =
        "none";

    document.getElementById("cancelButton").style.display =
        "none";

}


/* =====================================
   SAVE PROFILE
===================================== */

function saveProfile(){

    let fullname =
        document.getElementById("fullnameInput").value;

    let username =
        document.getElementById("usernameInput").value;


    if(fullname === "" || username === ""){

        alert("Please fill all fields.");

        return;

    }


    let formData = new FormData();

    formData.append("fullname", fullname);

    formData.append("username", username);

    function saveProfile(){

    let fullname =
        document.getElementById("fullnameInput").value.trim();

    let username =
        document.getElementById("usernameInput").value.trim();

    let email =
        document.getElementById("emailInput").value.trim();

    let mobile =
        document.getElementById("mobileInput").value.trim();


    if(fullname === "" ||
       username === "" ||
       email === "" ||
       mobile === ""){

        alert("All fields are required");
        return;
    }


    let formData = new FormData();

    formData.append("fullname", fullname);
    formData.append("username", username);
    formData.append("email", email);
    formData.append("mobile", mobile);


    fetch("php/update_profile.php", {

        method:"POST",
        credentials:"include",
        body:formData

    })

    .then(response => response.json())

    .then(data => {

        if(data.success){

            document.getElementById("fullname").innerText =
                fullname;

            document.getElementById("username").innerText =
                username;

            document.getElementById("email").innerText =
                email;

            document.getElementById("mobile").innerText =
                mobile;

            cancelEdit();

            alert("Profile updated successfully!");

        }else{

            alert(data.message);

        }

    })

    .catch(error => {

        console.error(error);

        alert("Error updating profile.");

    });

}


    fetch("php/update_profile.php", {

        method:"POST",

        credentials:"include",

        body:formData

    })

    .then(function(response){

        return response.json();

    })

    .then(function(data){

        console.log("UPDATE:", data);

        if(data.success){

            document.getElementById("fullname").innerText =
                fullname;

            document.getElementById("username").innerText =
                username;

            cancelEdit();

            alert("Profile updated successfully!");

        }
        else{

            alert(data.message);

        }

    })

    .catch(function(error){

        console.log(error);

        alert("Error updating profile.");

    });

}

</script>

</body>

</html>
