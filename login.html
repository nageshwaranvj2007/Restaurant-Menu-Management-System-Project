<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu Management - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff0822,#edecea);
}

.login-container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    text-align:center;
}

.login-container h1{
    color:#ff5722;
    margin-bottom:10px;
    font-size:36px;
}

.login-container p{
    color:#555;
    margin-bottom:20px;
    font-size:18px;
}

label{
    display:circle;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
    color:#333;
}

select,
input{
    width:100%;
    height:44px;
    padding:10px 12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    background:#fff;
    color:#333;
    font-family:Arial, Helvetica, sans-serif;
}

select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background:#fff;
    cursor:pointer;
}


button{
    width:100%;
    padding:14px;
    background:#ff0822;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff0822;
}

.links{
    margin-top:20px;
}

.links a{
    color:#ff0822;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-container">

<h1>🍽 Tamil Nadu Restaurant Login</h1>

<p>Restaurant Menu Management System</p>


<form action="php/login_process.php" method="POST">

<label>Username</label>
<input type="text" name="username" placeholder="Enter Username" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter Password" required>

<label>Login As</label>
<select name="role" required>
    <option value="admin">Admin</option>
    <option value="customer">Customer</option>
</select>

<button type="submit">Login</button>

</form>

<div class="links">
Don't have an account?
<a href="register.html">Register</a>
</div>

<div class="footer">
© 2026 Restaurant Menu Management System
</div>

</div>
