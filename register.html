<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff0822,#d1cdc6);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.register-box{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#ff0822;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#fa0822;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d9071d;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    color:#ff0822;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="register-box">

<h1>Register</h1>

<form action="php/register_process.php" method="POST">

    <input
        type="text"
        name="fullname"
        placeholder="Full Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email Address"
        required>

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">Register</button>

</form>

<div class="links">
    Already have an account?
    <a href="login.html">Login Here</a>
</div>

</div>

</body>
</html>
